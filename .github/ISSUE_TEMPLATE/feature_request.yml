name: Feature request
description: Suggest an idea or improvement for Zane.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! For large or design-changing
        proposals, consider opening a discussion first so we can shape the idea
        together.
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation behind it
      description: What's the motivation behind it?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help us understand the request — examples, references, prior art.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
